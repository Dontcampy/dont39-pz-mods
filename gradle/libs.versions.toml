[versions]
kotlin = "2.4.21"
kotlinxSerializationJSON = "1.11.0"
kotlinxCoroutines = "1.11.0"
# KSP2, versioned independently of Kotlin; generates the ZombieBuddy glue (zb-kt-utils-processor)
ksp = "2.3.12"
# build only: widens the jars features compile against (buildSrc)
asm = "9.11"
# zabric-processor: renders the generated glue
freemarker = "2.3.35"
# tests only (pz-junit)
junit = "5.14.0"
# tests only: runs KSP in zb-kt-utils-processor's tests; needs a release built on the ksp version above
kctfork = "0.14.0"
# build only: publishes zabric and zabric-processor (buildSrc pz-publish)
mavenPublish = "0.37.0"
# Zabric's mod version, also the version of its two Maven artifacts
zabric = "0.4.1"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinSerializationGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kspGradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
mavenPublishGradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
kspApi = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinStdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
freemarker = { module = "org.freemarker:freemarker", version.ref = "freemarker" }
junitBom = { module = "org.junit:junit-bom", version.ref = "junit" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
kctforkKsp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }
