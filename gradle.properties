# pzDir and pzServerDir (machine paths) go in ~/.gradle/gradle.properties, see README.md
org.gradle.caching=true
org.gradle.configuration-cache=true
# KSP runs in the daemon and outgrows the default 384m Metaspace; setting jvmargs replaces all of Gradle's defaults
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Kotlin mods compile against the stdlib/kotlinx the ZabricKotlin mod provides at runtime (see pz-kotlin).
kotlin.stdlib.default.dependency=false
