name: Project Zomboid jars
description: >-
  Fetches projectzomboid.jar from the dedicated server and ZombieBuddy.jar from its release into a folder for -PpzDir.
  The game jar is proprietary: it stays on the runner, never in an artifact or cache.
outputs:
  pz-dir:
    description: Folder holding projectzomboid.jar and ZombieBuddy.jar
    value: ${{ steps.paths.outputs.pz-dir }}
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: |
        echo "tools=$RUNNER_TEMP/depot-downloader" >> "$GITHUB_OUTPUT"
        echo "pz-dir=$RUNNER_TEMP/pz" >> "$GITHUB_OUTPUT"

    - name: Download DepotDownloader and ZombieBuddy
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLS: ${{ steps.paths.outputs.tools }}
        PZ_DIR: ${{ steps.paths.outputs.pz-dir }}
      run: |
        set -euo pipefail
        gh release download DepotDownloader_3.4.0 -R SteamRE/DepotDownloader -p DepotDownloader-linux-x64.zip -D "$TOOLS"
        # bump with ZombieBuddy (.trellis/spec/mod/zabric-hooks.md)
        gh release download v2.3.4 -R zed-0xff/ZombieBuddy -p ZombieBuddy.jar -D "$PZ_DIR"

    # no GH_TOKEN here: DepotDownloader is third-party
    - name: Download the game jar
      shell: bash
      env:
        TOOLS: ${{ steps.paths.outputs.tools }}
        PZ_DIR: ${{ steps.paths.outputs.pz-dir }}
      run: |
        set -euo pipefail
        unzip -q "$TOOLS/DepotDownloader-linux-x64.zip" -d "$TOOLS"
        chmod +x "$TOOLS/DepotDownloader"
        echo 'regex:(^|/)projectzomboid\.jar$' > "$TOOLS/files.txt"
        # the dedicated server downloads anonymously; the unstable branch is Build 42, the same jar as the client's
        (cd "$TOOLS" && ./DepotDownloader -app 380870 -branch unstable -os linux -filelist "$TOOLS/files.txt" \
          -dir "$TOOLS/server")
        mv "$TOOLS/server/java/projectzomboid.jar" "$PZ_DIR/"
